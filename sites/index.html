<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalDuckBox | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --accent: #38bdf8;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f1f5f9;
        }

        [data-theme="light"] {
            --bg: #f0f9ff;
            --accent: #0284c7;
            --glass: rgba(0, 0, 0, 0.05);
            --border: rgba(0, 0, 0, 0.1);
            --text: #0f172a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 0.5s ease; /* Smooth theme slide */
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard {
            position: relative;
            width: 90%;
            max-width: 850px;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .control-center {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .widget {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .widget:hover { transform: scale(1.03); }

        /* TASK LIST STYLE */
        .task-list {
            text-align: left;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .task-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .task-item input { accent-color: var(--accent); }

        /* THE ORIGINAL RECOMMENDATION BOX */
        .rec-box {
            background: rgba(56, 189, 248, 0.05);
            border: 2px dashed var(--accent);
            padding: 20px;
            border-radius: 20px;
            margin-top: 30px;
            text-align: left;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .nav-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text);
            transition: 0.3s;
            font-weight: 600;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
        }

        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--glass); border: 1px solid var(--border);
            color: var(--text); padding: 10px; border-radius: 50%;
            cursor: pointer;
        }

        h1 { font-family: 'Orbitron'; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-send { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="dashboard">
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>

        <div style="font-size: 0.7rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 10px;">CORE INTERFACE v2.1</div>
        <h1>THE POND</h1>

        <div class="control-center">
            <div class="widget">
                <div style="font-size: 0.6rem; opacity: 0.6;">SYSTEM CLOCK</div>
                <div id="clock" style="font-family: 'Orbitron'; color: var(--accent);">00:00:00</div>
            </div>
            <div class="widget">
                <div style="font-size: 0.6rem; opacity: 0.6;">CURRENT GOALS</div>
                <div class="task-list">
                    <div class="task-item"><input type="checkbox" checked> UI Animations</div>
                    <div class="task-item"><input type="checkbox"> Python Scripts</div>
                </div>
            </div>
            <div class="widget">
                <div style="font-size: 0.6rem; opacity: 0.6;">DUCK POWER</div>
                <div style="height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 8px;">
                    <div style="width: 85%; height: 100%; background: var(--accent); border-radius: 5px;"></div>
                </div>
            </div>
        </div>

        <div class="grid">
            <a href="about-me/index.html" class="nav-card">👤 Identity</a>
            <a href="../games/pixel-gallery/index.html" class="nav-card">🎨 Gallery</a>
            <a href="../projects/duck_converter.py" class="nav-card">🐍 Converter</a>
            <a href="../projects/system_check.py" class="nav-card">🚀 Diagnostic</a>
        </div>

        <div class="rec-box">
            <h3 style="margin:0; font-size: 0.9rem; font-family: 'Orbitron';">📥 RECOMMENDATIONS</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="user-input" placeholder="Idea for the box?" style="flex-grow: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--border); padding: 10px; border-radius: 10px; color: var(--text);">
                <button class="btn-send" onclick="sendToGitHub()">QUACK</button>
            </div>
        </div>
    </div>

    <script>
        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
        setInterval(updateClock, 1000); updateClock();

        function toggleTheme() {
            const body = document.documentElement;
            const btn = document.getElementById('theme-btn');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                btn.innerText = '🌙';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '☀️';
            }
        }

        function sendToGitHub() {
            const val = document.getElementById('user-input').value;
            if (val) window.open(`https://github.com/LuckyDuck745/DigitalDuckBox/issues/new?title=Suggestion&body=${encodeURIComponent(val)}`, '_blank');
        }
    </script>
</body>
</html>
